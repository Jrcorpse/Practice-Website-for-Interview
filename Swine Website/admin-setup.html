<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Setup | SADS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #1a1a1a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .setup-box { background: #2d2d2d; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; border-top: 5px solid #8a388a; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 6px; border: none; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #8a388a; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { background: #a24ba2; }
    </style>
</head>
<body>

    <div class="setup-box">
        <h2 style="margin-top: 0;">System Admin Creation</h2>
        <div id="status" style="color: #ff4d4d; margin-bottom: 10px; font-size: 0.85rem;"></div>
        
        <input type="text" id="adminName" placeholder="Admin Full Name" required>
        <input type="email" id="adminEmail" placeholder="Admin Email" required>
        <input type="password" id="adminPassword" placeholder="New Password" required>
        <input type="password" id="secretPasscode" placeholder="Master Key" required>
        
        <button id="createAdminBtn">Initialize Admin Profile</button>
    </div>

    <script type="module">
        import { supabase } from './supabaseClient.js';

        document.getElementById('createAdminBtn').addEventListener('click', async () => {
            const name = document.getElementById('adminName').value;
            const email = document.getElementById('adminEmail').value;
            const pass = document.getElementById('adminPassword').value;
            const secret = document.getElementById('secretPasscode').value;
            const status = document.getElementById('status');

            // Deterrent check (Change this string to whatever you want)
            if (secret !== 'SADS-MASTER-2026') {
                status.innerText = "Access Denied: Invalid Master Key.";
                return;
            }

            status.style.color = "white";
            status.innerText = "Processing...";

            try {
                const { data, error: authError } = await supabase.auth.signUp({
                    email: email,
                    password: pass,
                });

                if (authError) throw authError;

                if (data.user) {
                    const { error: profileError } = await supabase
                        .from('profiles')
                        .upsert([{ 
                            id: data.user.id, 
                            full_name: name, 
                            role: 'admin',
                            admin_code: secret
                        }]);

                    if (profileError) throw profileError;

                    alert('Admin Created Successfully!');
                    window.location.replace('login.html');
                }
            } catch (err) {
                status.style.color = "#ff4d4d";
                status.innerText = err.message;
            }
        });
    </script>
</body>
</html>sss
